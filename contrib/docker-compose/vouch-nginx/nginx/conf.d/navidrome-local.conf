# =============================================================================
# Local HTTP-only Nginx config for Navidrome + Vouch Proxy
# Access the app at: http://localhost:8080
# =============================================================================

upstream vouch_backend {
    server vouch:9090;
}

upstream navidrome_backend {
    server navidrome:4633;
}

server {
    listen 8080;
    server_name localhost;

    # ------------------------------------------------------------------
    # Internal: Vouch validation endpoint.
    # Nginx calls this on every request to check if the user is authed.
    # ------------------------------------------------------------------
    location = /validate {
        internal;

        proxy_pass http://vouch_backend/validate;

        # Do not send the request body to Vouch
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # Forward original request details so Vouch can validate the cookie
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward the original URI (Vouch uses this for post-login redirect)
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    }

    # ------------------------------------------------------------------
    # Subsonic API: Bypass Vouch auth entirely.
    # Mobile clients (DSub, Symfonium, etc.) use password/token auth,
    # not OAuth — they cannot go through the Vouch flow.
    # ------------------------------------------------------------------
    location /rest/ {
        proxy_pass http://navidrome_backend;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Share links: Bypass auth so shared album/playlist links work
    # for unauthenticated visitors.
    # ------------------------------------------------------------------
    location /share/ {
        proxy_pass http://navidrome_backend;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Login endpoint: user explicitly clicks "Login" → Google OAuth via Vouch.
    # After Google auth, Vouch cookie is set and user lands back at /.
    # ------------------------------------------------------------------
    location = /login {
        return 302 http://localhost:9090/login?url=http://localhost:8080/;
    }

    # ------------------------------------------------------------------
    # Logout endpoint: clear the VouchCookie directly (Max-Age=0) and redirect
    # to /login so the user is sent straight to Google OAuth again.
    # Bypasses Vouch's /logout endpoint which rejects localhost:port URLs.
    # ------------------------------------------------------------------
    location = /logout {
        add_header Set-Cookie "VouchCookie=; Domain=localhost; Path=/; Max-Age=0; HttpOnly; SameSite=Lax" always;
        return 302 /;
    }

    # ------------------------------------------------------------------
    # All other paths: try Vouch validation but NEVER block the request.
    # - Vouch cookie present → use the Google user's email as Remote-User
    # - No Vouch cookie      → fall through to @guest (japtaptest)
    # ------------------------------------------------------------------
    location / {
        auth_request /validate;

        # If Vouch says 401 (not logged in) → serve as guest, don't force login
        error_page 401 = @guest;

        # Capture the authenticated user's email from Vouch
        auth_request_set $vouch_user $upstream_http_x_vouch_user;

        # Pass the Google user email to Navidrome
        proxy_set_header Remote-User $vouch_user;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_pass http://navidrome_backend;
    }
    # ------------------------------------------------------------------
    # Guest fallback: no Vouch cookie → serve as japtaptest.
    # Navidrome treats this as the default anonymous user.
    # ------------------------------------------------------------------
    location @guest {
        proxy_set_header Remote-User "japtaptest";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_pass http://navidrome_backend;
    }
}
