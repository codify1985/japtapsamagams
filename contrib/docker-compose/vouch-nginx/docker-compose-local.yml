version: '3.6'

# Local HTTP-only testing stack: Nginx + Vouch Proxy + Navidrome
#
# Usage:
#   1. Copy vouch-config-local.yml.template → vouch-config-local.yml
#   2. Fill in your Google Client ID and Secret in vouch-config-local.yml
#   3. Set Google redirect URI to: http://localhost:9090/auth
#   4. Run: docker compose -f docker-compose-local.yml up -d
#   5. Access: http://localhost:8080

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # Navidrome — Music Server
  # ─────────────────────────────────────────────────────────────────────────────
  navidrome:
    image: navidrome-local:latest
    restart: unless-stopped
    volumes:
      - /Users/gagan/MyCodebae/japtapsamagams/data:/data
      - /Users/gagan/MyCodebae/japtapsamagams/music:/music:ro
      - /Users/gagan/MyCodebae/japtapsamagams/logs:/logs
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_PORT: 4633
      ND_LOGFILE: /logs/log.txt
      ND_FFMPEGPATH: /usr/bin/ffmpeg

      # Reverse proxy auth — only trust traffic from the Nginx container on this network
      ND_REVERSEPROXYWHITELIST: "172.22.0.0/16"
      ND_REVERSEPROXYUSERHEADER: "Remote-User"

      # Disable auto-login so Vouch controls access
      ND_DEVAUTOLOGINUSERNAME: ""

      # Lock down user management (OAuth handles access control)
      ND_ENABLEUSEREDITING: "false"
      ND_ENABLEUSERSELFSNIGNUP: "false"
    networks:
      - vouch-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Vouch Proxy — Google OAuth Handler
  # Exposed on host port 9090 so the browser can reach /login and /auth callbacks
  # ─────────────────────────────────────────────────────────────────────────────
  vouch:
    image: quay.io/vouch/vouch-proxy:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./vouch-config-local.yml:/config/config.yml:ro
    networks:
      - vouch-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Nginx — Reverse Proxy
  # All browser traffic goes through here; Nginx calls Vouch to validate each request
  # ─────────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/navidrome-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - navidrome
      - vouch
    networks:
      - vouch-net

networks:
  vouch-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
