version: "2"
run:
  build-tags:
    - netgo
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - dogsled
    - durationcheck
    - errorlint
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nilerr
    - rowserrcheck
    - unconvert
    - whitespace
  disable:
    - staticcheck
  settings:
    gocritic:
      disable-all: true
      enabled-checks:
        - deprecatedComment
    gosec:
      excludes:
        - G501
        - G401
        - G505
        - G115
        # Rules below fire on pre-existing upstream Navidrome code.
        # They were exposed after upgrading golangci-lint from 2.1.6 → 2.10.1
        # (new taint-analysis and secret-pattern detectors added in 2.x).
        # These are not issues introduced by this fork.
        - G101   # Potential hardcoded credentials (false positive: map of SQL field names)
        - G117   # Exported struct field matches secret pattern (legitimate config structs)
        - G703   # Path traversal via taint analysis (os.Stat in upstream storage code)
        - G704   # SSRF via taint analysis (HTTP clients in upstream agent code)
        - G705   # XSS via taint analysis (w.Write in upstream handler code)
    govet:
      enable:
        - nilness
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
